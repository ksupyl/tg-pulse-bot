# Настройки инструментов разработки. Зависимости самого бота — в requirements.txt.

[tool.ruff]
# 79 символов из PEP 8 — наследие терминалов 80-х: русские комментарии туда не влезают
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# E/W — стиль (pycodestyle), F — настоящие ошибки (неиспользуемые импорты, опечатки в именах),
# I — порядок импортов
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Корень проекта в sys.path, чтобы `import app...` работал при любом способе запуска pytest
pythonpath = ["."]
# async def test_... запускаются сами, без декоратора @pytest.mark.asyncio на каждом
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
